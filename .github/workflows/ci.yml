name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Test Rust code
        run: cargo test --locked
      - name: Lint Rust code
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test development shim
        run: python3 scripts/test_cslim_dev.py
      - name: Test target migration
        run: python3 scripts/test_migrate_targets.py
