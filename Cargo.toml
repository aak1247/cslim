[package]
name = "cargo-cslim"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
description = "Managed Cargo targets and versioned cross-workspace compiler caches"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
